[workspace]
resolver = "3"
members = ["crates/core", "crates/directory", "crates/ingest", "crates/stats", "crates/eunox"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/eunolabs/eunox"

[workspace.dependencies]
web-bot-auth = "0.7.0"
sfv = "0.15.0"
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde", "std"] }
eunox-core = { path = "crates/core" }
eunox-directory = { path = "crates/directory" }
eunox-ingest = { path = "crates/ingest" }
eunox-stats = { path = "crates/stats" }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy", "http2"] }
hickory-resolver = "0.26.3"
serde_json = "1.0.154"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tonic = "0.14.9"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "logs", "metrics"] }
tokio-stream = { version = "0.1", features = ["net"] }
