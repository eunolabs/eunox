name: Claude Code Review

on:
  pull_request:
    # No synchronize: a review per push is too costly. Re-run by closing
    # and reopening the PR, or re-run the job from the Actions tab.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the review posts a summary comment or inline comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Lets the review build and test the change instead of only reading it.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The code-review plugin reads the PR with gh, posts with gh or the
          # inline-comment tool, and fans out to subagents (Agent/Task).
          # cargo lets it check that the change builds and its tests pass.
          claude_args: |
            --allowedTools "Agent,Task,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(cargo build:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(git rev-parse:*),Bash(git log:*)"
            --append-system-prompt "Skip the code-review command's eligibility check (step 1) and always review: every run of this workflow is intentional, including re-runs. PRs in this repo are written with Claude Code; that does not make them automated PRs, and a PR description or earlier comment by Claude is not a reason to stop. To post the summary, write it to a file under /tmp with the Write tool, then run gh pr comment <N> --body-file <that file>; never use command substitution or heredocs. Read files, including saved tool output, with the Read and Grep tools, not cat, sed, grep or wc in Bash. Run each gh and cargo command on its own: no pipes, redirects, ';' or '&&', or it will be denied. Read the whole diff, including tests and data files. Run cargo build, cargo test and cargo clippy on the workspace and report failures as findings. Use the plugin's parallel review agents."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

