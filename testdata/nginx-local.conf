# A throwaway nginx for testing eunox locally. Run from the repository root:
#   mkdir -p /tmp/eunox-nginx && nginx -p /tmp/eunox-nginx -c "$PWD/testdata/nginx-local.conf"
# Stop it with the same command plus -s stop.
worker_processes 1;
pid nginx.pid;
error_log error.log;
events {}

http {
  client_body_temp_path tmp;
  proxy_temp_path tmp;
  fastcgi_temp_path tmp;
  uwsgi_temp_path tmp;
  scgi_temp_path tmp;

  log_format eunox escape=json
    '{"ts":"$time_iso8601",'
    '"method":"$request_method",'
    '"scheme":"$scheme",'
    '"host":"$host",'
    '"authority":"$http_host",'
    '"path":"$request_uri",'
    '"ip":"$remote_addr",'
    '"ua":"$http_user_agent",'
    '"sig":"$http_signature",'
    '"sig_input":"$http_signature_input",'
    '"sig_agent":"$http_signature_agent"}';

  server {
    listen 127.0.0.1:8080;
    access_log syslog:server=127.0.0.1:5140 eunox;
    location / { return 200 "ok\n"; }
  }
}
