# nginx for the compose demo: proxies :8080 to the sample upstream and sends
# each request to eunox over syslog. The two eunox lines are the whole
# integration: log_format and access_log.
worker_processes 1;
events {}

http {
  log_format eunox escape=json
    '{"ts":"$time_iso8601",'
    '"method":"$request_method",'
    '"scheme":"$scheme",'
    '"host":"$host",'
    '"authority":"$http_host",'
    '"path":"$request_uri",'
    '"ip":"$remote_addr",'
    '"ua":"$http_user_agent",'
    '"sig":"$http_signature",'
    '"sig_input":"$http_signature_input",'
    '"sig_agent":"$http_signature_agent"}';

  server {
    listen 8080;
    access_log syslog:server=eunox:5140 eunox;
    location / {
      proxy_pass http://upstream:80;
    }
  }
}
